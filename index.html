
  
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JONI Cartoon World</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  height: 100vh;
  overflow: hidden;
  background: radial-gradient(circle, #25105c, #030313);
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: Arial, sans-serif;
}

.scene {
  text-align: center;
  perspective: 800px;
  z-index: 2;
}

h1 {
  font-size: clamp(65px, 18vw, 150px);
  color: white;
  letter-spacing: 12px;
  text-shadow: 0 0 15px cyan,
               0 0 40px blue,
               0 0 80px purple;
  animation: rotate 3s infinite alternate;
}

.subtitle {
  color: cyan;
  letter-spacing: 8px;
  margin-top: 15px;
}

@keyframes rotate {
  from { transform: rotateY(-15deg) scale(.9); }
  to { transform: rotateY(15deg) scale(1.1); }
}

/* Floating cartoons */

.sticker {
  position: absolute;
  font-size: clamp(35px, 8vw, 65px);
  animation: float 5s ease-in-out infinite;
  z-index: 1;
  filter: drop-shadow(0 0 12px #a855f7);
}

.s1 { top: 10%; left: 10%; animation-delay: 0s; }
.s2 { top: 20%; right: 12%; animation-delay: 1s; }
.s3 { bottom: 15%; left: 15%; animation-delay: 2s; }
.s4 { bottom: 12%; right: 15%; animation-delay: 1.5s; }
.s5 { top: 48%; left: 5%; animation-delay: 2.5s; }
.s6 { top: 45%; right: 5%; animation-delay: 3s; }

@keyframes float {
  0%, 100% {
    transform: translateY(0) rotate(-10deg) scale(1);
  }
  50% {
    transform: translateY(-45px) rotate(15deg) scale(1.2);
  }
}

/* Sparkles */

.particle {
  position: absolute;
  width: 4px;
  height: 4px;
  background: cyan;
  border-radius: 50%;
  box-shadow: 0 0 12px cyan;
  animation: rise 6s linear infinite;
}

@keyframes rise {
  from { transform: translateY(100vh); opacity: 0; }
  20% { opacity: 1; }
  to { transform: translateY(-10vh); opacity: 0; }
}
</style>
</head>

<body>

<!-- Cartoon stickers -->
<div class="sticker s1">🐼</div>
<div class="sticker s2">🦊</div>
<div class="sticker s3">🐸</div>
<div class="sticker s4">🐱</div>
<div class="sticker s5">🚀</div>
<div class="sticker s6">👻</div>

<div class="scene">
  <h1>JONI</h1>
  <div class="subtitle">THE FUTURE IS MINE</div>
</div>

<script>
for(let i = 0; i < 70; i++) {
  const p = document.createElement("div");
  p.className = "particle";
  p.style.left = Math.random() * 100 + "vw";
  p.style.animationDelay = Math.random() * 6 + "s";
  p.style.animationDuration = (3 + Math.random() * 6) + "s";
  document.body.appendChild(p);
}
</script>

</body>
</html>
